schema_version: "1.0"
name: no-trigger
description: A general question must not trigger the skill or touch the memory.
tags: [trigger, negative]
execution:
  prompt: "What is a RACI matrix? Answer in two sentences."
  max_turns: 5
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 1
graders:
  - type: tool_used
    name: skill-not-fired
    tool: Skill
    input_match: meeting-to-actions
    min: 0
    max: 0
    arm: both
  - type: regex
    name: answers-question
    target: last_message
    pattern: "responsib|accountab"
    flags: i
  - type: file_exists
    name: memory-untouched
    path: memory/actions.md
    exists: false
